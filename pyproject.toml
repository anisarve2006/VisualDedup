[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualdedup"
version = "0.2.0"
description = "High-performance visual duplicate detection, intelligent keeper recommendation, and safe dataset cleanup."
readme = "README.md"
authors = [{ name = "VisualDedup Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "pillow>=9.0.0",
    "numpy>=1.20.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/anisarve2006/visualdedup"
Repository = "https://github.com/anisarve2006/visualdedup.git"
Issues = "https://github.com/anisarve2006/visualdedup/issues"
Changelog = "https://github.com/anisarve2006/visualdedup/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
visualdedup = "visualdedup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
